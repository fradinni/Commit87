app-id: fr.fradinni.Commit87
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '24.08'
command: commit87-run
separate-locales: false
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=home
  - --filesystem=/media
  - --filesystem=/run/media
  - --filesystem=xdg-run/gnupg:ro
  - --filesystem=~/.ssh:ro
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.gnome.keyring
  - --talk-name=org.kde.StatusNotifierWatcher
  - --env=COMMIT87_FLATPAK=1

modules:
  - name: git
    buildsystem: simple
    build-commands:
      # The SDK has no perl; NO_PERL=YesPlease lets configure accept --without-perl.
      - NO_PERL=YesPlease ./configure --prefix=/app --with-openssl --with-curl --with-expat --with-zlib --without-tcltk --without-perl --without-python
      - make -j"${FLATPAK_BUILDER_N_JOBS:-4}"
      - make install
    sources:
      - type: archive
        url: https://mirrors.edge.kernel.org/pub/software/scm/git/git-2.51.2.tar.xz
        sha256: 233d7143a2d58e60755eee9b76f559ec73ea2b3c297f5b503162ace95966b4e3
        x-checker-data:
          type: anitya
          project-id: 5350
          url-template: https://mirrors.edge.kernel.org/pub/software/scm/git/git-$version.tar.xz

  - name: commit87
    buildsystem: simple
    build-commands:
      - install -Dm755 commit87.sh /app/bin/commit87-run
      - cp -r commit87 /app/commit87
      - install -Dm644 icons/512x512.png /app/share/icons/hicolor/512x512/apps/fr.fradinni.Commit87.png
      - install -Dm644 icons/128x128.png /app/share/icons/hicolor/128x128/apps/fr.fradinni.Commit87.png
      - install -Dm644 icons/64x64.png /app/share/icons/hicolor/64x64/apps/fr.fradinni.Commit87.png
      - install -Dm644 fr.fradinni.Commit87.desktop /app/share/applications/fr.fradinni.Commit87.desktop
      - install -Dm644 fr.fradinni.Commit87.metainfo.xml /app/share/metainfo/fr.fradinni.Commit87.metainfo.xml
      - install -Dm644 LICENSE /app/share/licenses/fr.fradinni.Commit87/LICENSE
    sources:
      - type: file
        path: commit87.sh
      - type: file
        path: fr.fradinni.Commit87.desktop
      - type: file
        path: fr.fradinni.Commit87.metainfo.xml
      - type: dir
        path: ../dist/linux-unpacked
        dest: commit87
      - type: dir
        path: ../build/icons
        dest: icons
      - type: file
        path: ../LICENSE
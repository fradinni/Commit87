name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, test and build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y git
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Upload renderer bundle
        uses: actions/upload-artifact@v7
        with:
          name: built-app
          path: out
          retention-days: 7

  package-linux:
    name: Linux packages (x64 + arm64)
    needs: verify
    # Keep packaging on one job so the two architectures do not compete for
    # separate runners. electron-builder downloads the arm64 Electron runtime
    # and cross-packages it on the x64 host; there are no native addons here.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Cache Electron and packaging toolsets
        # electron-builder downloads the Electron runtime and its toolsets from
        # GitHub releases on every cold run. Keeping the cache makes repeat builds
        # independent of that network path; the lockfile hash refreshes the cache
        # for a dependency change while restore-keys keeps the previous entries.
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/electron-builder
          key: ${{ runner.os }}-electron-builder-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-builder-
      - run: npm ci
      - run: npm run build
      - name: Install Linux packaging tools
        # fpm (bundled by electron-builder) builds deb/rpm/pacman archives and the
        # pacman .MTREE index with bsdtar, which Ubuntu does not include by default.
        run: sudo apt-get update && sudo apt-get install -y fakeroot rpm libarchive-tools
      - name: Build AppImage, deb, rpm, pacman and tar.gz for x64 and arm64
        # The wrapper retries transient download failures (5xx, resets) with backoff.
        run: node scripts/build-packages.mts --config electron-builder.config.cjs --linux --x64 --arm64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v7
        with:
          name: linux-x64-arm64
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.xz
            dist/*.tar.gz
          retention-days: 14

  package-windows:
    name: Windows packages (x64 + arm64)
    needs: verify
    # Both architectures share latest.yml, so build them in one invocation.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Cache Electron and packaging toolsets
        uses: actions/cache@v6
        with:
          path: |
            ~/AppData/Local/electron-builder/Cache
          key: ${{ runner.os }}-electron-builder-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-builder-
      - run: npm ci
      - run: npm run build
      - name: Build NSIS, portable and zip for x64 and arm64
        run: node scripts/build-packages.mts --config electron-builder.config.cjs --win --x64 --arm64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v7
        with:
          name: windows-x64-arm64
          path: |
            dist/*.exe
            dist/*.zip
          retention-days: 14

  package-macos:
    name: macOS packages (x64 + arm64)
    needs: verify
    # One job for both architectures: they share latest-mac.yml, and asking for
    # two separate macOS runners risks the second job starving in the queue.
    # macos-13 (the last Intel image) is retiring, so both are packaged on the
    # Apple Silicon runner: arm64 natively, x64 cross-packaged.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Cache Electron and packaging toolsets
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/electron-builder
          key: ${{ runner.os }}-electron-builder-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-builder-
      - run: npm ci
      - run: npm run build
      - name: Build dmg and zip for x64 and arm64
        run: node scripts/build-packages.mts --config electron-builder.config.cjs --mac --x64 --arm64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # Unsigned macOS builds are only usable if the fuse-patched binaries were
      # re-signed (electronFuses.resetAdHocDarwinSignature). Fail here instead of
      # shipping artifacts that macOS rejects as damaged.
      - name: Verify macOS code signature
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apps=(dist/mac*/Commit87.app)
          if ((${#apps[@]} == 0)); then
            echo "::error::No macOS app bundle found under dist/mac*"
            exit 1
          fi
          for app in "${apps[@]}"; do
            echo "Verifying $app..."
            codesign --verify --deep --strict --verbose=1 "$app" || {
              echo "::error::$app has an invalid code signature; macOS would report the app as damaged."
              exit 1
            }
          done
      - uses: actions/upload-artifact@v7
        with:
          name: macos-x64-arm64
          path: |
            dist/*.dmg
            dist/*.zip
          retention-days: 14
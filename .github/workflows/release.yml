name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      draft:
        description: Publish as a draft release
        type: boolean
        default: true

permissions:
  contents: write

# Serialize release runs so two builds never upload to the same draft at once.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare draft release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Clear draft release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # electron-builder replaces assets with delete-then-upload, which races
        # GitHub's asset index for the tiny latest*.yml files. A tag push always
        # rebuilds the draft from scratch, so clear it before any job publishes.
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$(node -p "require('./package.json').version")"
          fi
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --draft --title "Commit87 ${tag#v}" --target "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY"
            exit 0
          fi
          if [[ "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" != "true" ]]; then
            echo "::error::Release $tag is already published; refusing to replace its assets."
            exit 1
          fi
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' |
            while IFS= read -r asset; do
              [[ -z "$asset" ]] && continue
              gh release delete-asset "$tag" "$asset" --yes --repo "$GITHUB_REPOSITORY"
            done

  release:
    name: Publish ${{ matrix.target }} (${{ matrix.arch }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux
            arch: x64
            archArgs: --x64
            runner: ubuntu-24.04
            electronCache: |
              ~/.cache/electron-builder
          - target: linux
            arch: arm64
            archArgs: --arm64
            runner: ubuntu-24.04-arm
            electronCache: |
              ~/.cache/electron-builder
          # Both Windows architectures share latest.yml, so build them in one
          # invocation: separate jobs would overwrite each other's metadata and
          # leave one architecture pointing at the other installer.
          - target: win
            arch: x64+arm64
            archArgs: --x64 --arm64
            runner: windows-2022
            electronCache: |
              ~/AppData/Local/electron-builder/Cache
          # Both macOS architectures share latest-mac.yml, so build them in one
          # invocation. macos-13 (the last Intel image) is retiring, so x64 is
          # cross-packaged on the Apple Silicon runner instead.
          - target: mac
            arch: x64+arm64
            archArgs: --x64 --arm64
            runner: macos-15
            electronCache: |
              ~/Library/Caches/electron-builder
    runs-on: ${{ matrix.runner }}
    env:
      # Only -beta.N tags use the beta feed. Any other prerelease identifier
      # would publish a channel file no client asks for, so the workflow rejects
      # it below.
      COMMIT87_RELEASE_CHANNEL: ${{ startsWith(github.ref, 'refs/tags/') && contains(github.ref_name, '-beta.') && 'beta' || 'latest' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Cache Electron and packaging toolsets
        uses: actions/cache@v6
        with:
          path: ${{ matrix.electronCache }}
          key: ${{ runner.os }}-electron-builder-${{ matrix.arch }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-builder-${{ matrix.arch }}-
            ${{ runner.os }}-electron-builder-
      - name: Validate release channel
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          if [[ "$tag" == *-* && "$tag" != *-beta.* ]]; then
            echo "::error::Only -beta.N prerelease tags are supported; got $GITHUB_REF_NAME"
            exit 1
          fi
      - run: npm ci
      - name: Install Linux packaging tools
        if: matrix.target == 'linux'
        # deb/rpm/pacman go through electron-builder's bundled fpm, which needs
        # fakeroot and rpm on the host and bsdtar (libarchive-tools) for the
        # pacman .MTREE index.
        run: sudo apt-get update && sudo apt-get install -y fakeroot rpm libarchive-tools
      - run: node scripts/sync-version.mjs "${GITHUB_REF_NAME#v}"
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
      - run: npm test
      - run: npm run build
      - name: Build and publish
        shell: bash
        # electron-builder treats an empty CSC_LINK as a certificate path and
        # fails on the project directory, so the signing variables are only
        # exported when the matching secret is configured.
        run: |
          if [ -n "${SIGN_MAC_CERT:-}" ]; then
            export CSC_LINK="$SIGN_MAC_CERT"
            export CSC_KEY_PASSWORD="$SIGN_MAC_CERT_PASSWORD"
          else
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          if [ -n "${SIGN_APPLE_ID:-}" ]; then
            export APPLE_ID="$SIGN_APPLE_ID"
            export APPLE_APP_SPECIFIC_PASSWORD="$SIGN_APPLE_PASSWORD"
            export APPLE_TEAM_ID="$SIGN_APPLE_TEAM_ID"
          fi
          if [ -n "${SIGN_WIN_CERT:-}" ]; then
            export WIN_CSC_LINK="$SIGN_WIN_CERT"
            export WIN_CSC_KEY_PASSWORD="$SIGN_WIN_CERT_PASSWORD"
          fi
          # scripts/build-packages.mts runs electron-builder and retries transient
          # download failures (5xx, resets) with backoff, so a short GitHub
          # incident does not fail a release whose code is already verified.
          node scripts/build-packages.mts --config electron-builder.config.cjs --${{ matrix.target }} ${{ matrix.archArgs }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGN_MAC_CERT: ${{ matrix.target == 'mac' && secrets.MAC_CERT_P12 || '' }}
          SIGN_MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          SIGN_APPLE_ID: ${{ secrets.APPLE_ID }}
          SIGN_APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          SIGN_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SIGN_WIN_CERT: ${{ matrix.target == 'win' && secrets.WIN_CERT_P12 || '' }}
          SIGN_WIN_CERT_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
      # macOS refuses to run an app whose code signature does not match its
      # binaries: the fuse patch invalidates Electron's linker ad-hoc signature,
      # and without a Developer ID certificate electron-builder leaves it broken,
      # so Gatekeeper kills the app at launch ("application is damaged"). The
      # electronFuses.resetAdHocDarwinSignature option re-signs ad-hoc after the
      # patch; this step proves the result is valid so a broken app can never
      # reach the draft release.
      - name: Verify macOS code signature
        if: matrix.target == 'mac'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apps=(dist/mac*/Commit87.app)
          if ((${#apps[@]} == 0)); then
            echo "::error::No macOS app bundle found under dist/mac*"
            exit 1
          fi
          for app in "${apps[@]}"; do
            echo "Verifying $app..."
            codesign --verify --deep --strict --verbose=1 "$app" || {
              echo "::error::$app has an invalid code signature; macOS would report the app as damaged."
              exit 1
            }
          done
      - name: Warn on unsigned macOS build
        if: matrix.target == 'mac'
        shell: bash
        env:
          SIGN_MAC_CERT: ${{ secrets.MAC_CERT_P12 }}
        run: |
          if [ -n "${SIGN_MAC_CERT:-}" ]; then
            exit 0
          fi
          echo "::warning::macOS build is ad-hoc signed but not signed with a Developer ID certificate and not notarized."
          echo "::warning::Users downloading it will see a Gatekeeper prompt (System Settings > Privacy & Security > Open Anyway to launch)."
          echo "::warning::Configure MAC_CERT_P12, MAC_CERT_PASSWORD, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD and APPLE_TEAM_ID secrets for fully signed, notarized releases."

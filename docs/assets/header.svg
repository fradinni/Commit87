<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="headerTitle headerDesc">
  <title id="headerTitle">Commit87</title>
  <desc id="headerDesc">The Commit87 branch logo and wordmark over an animated aurora background with drifting grid lines and floating light particles.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#061014"/>
      <stop offset="0.55" stop-color="#081a1b"/>
      <stop offset="1" stop-color="#071219"/>
    </linearGradient>

    <radialGradient id="auroraMint" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3ddc97" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#34c98a" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#3ddc97" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auroraBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5ba8ff" stop-opacity="0.5"/>
      <stop offset="0.5" stop-color="#4a8ff0" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#5ba8ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auroraPurple" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c792ea" stop-opacity="0.45"/>
      <stop offset="0.5" stop-color="#a06fd0" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#c792ea" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="grove" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3ddc97"/>
      <stop offset="1" stop-color="#1f9f6c"/>
    </linearGradient>

    <linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f2fff9"/>
      <stop offset="0.45" stop-color="#3ddc97">
        <animate attributeName="stop-color" values="#3ddc97;#5ba8ff;#c792ea;#3ddc97" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.8" stop-color="#c792ea">
        <animate attributeName="stop-color" values="#c792ea;#3ddc97;#5ba8ff;#c792ea" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#9be7ff"/>
    </linearGradient>

    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#d7fff0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="vignette" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.55" stop-color="#040b0e" stop-opacity="0"/>
      <stop offset="1" stop-color="#040b0e" stop-opacity="0.75"/>
    </linearGradient>

    <radialGradient id="gridFade" cx="0.5" cy="0.5" r="0.72">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="0.65" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <pattern id="gridPattern" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#3ddc97" stroke-opacity="0.1" stroke-width="1"/>
      <circle cx="0" cy="0" r="1.4" fill="#c792ea" fill-opacity="0.25"/>
    </pattern>

    <mask id="gridMask">
      <rect width="1200" height="400" fill="url(#gridFade)"/>
    </mask>

    <filter id="softBlur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="48"/>
    </filter>

    <filter id="logoGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="textGlow" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>

    <g id="logoMark">
      <path d="M160 128v147.2a64 64 0 0 0 64 64h128" fill="none" stroke="url(#grove)" stroke-width="38" stroke-linecap="round"/>
      <path d="M160 280v104" fill="none" stroke="#5ba8ff" stroke-width="38" stroke-linecap="round"/>
      <path d="M360 339v-80" fill="none" stroke="#c792ea" stroke-width="32" stroke-linecap="round"/>
      <circle cx="160" cy="120" r="38" fill="#3ddc97"/>
      <circle cx="160" cy="400" r="38" fill="#5ba8ff"/>
      <circle cx="360" cy="339" r="38" fill="#c792ea"/>
      <circle cx="360" cy="216" r="35" fill="#c792ea"/>
    </g>
  </defs>

  <!-- background -->
  <rect width="1200" height="400" fill="url(#bg)"/>

  <!-- aurora fields -->
  <g filter="url(#softBlur)">
    <ellipse cx="230" cy="110" rx="360" ry="200" fill="url(#auroraMint)">
      <animateTransform attributeName="transform" type="translate" values="0 0;130 45;-55 90;0 0" keyTimes="0;0.35;0.7;1" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1" dur="26s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="810" cy="60" rx="380" ry="210" fill="url(#auroraBlue)">
      <animateTransform attributeName="transform" type="translate" values="0 0;-150 55;70 120;0 0" keyTimes="0;0.32;0.68;1" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1" dur="31s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="1080" cy="330" rx="320" ry="190" fill="url(#auroraPurple)">
      <animateTransform attributeName="transform" type="translate" values="0 0;90 -70;-100 -15;0 0" keyTimes="0;0.4;0.72;1" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1" dur="29s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="560" cy="430" rx="520" ry="180" fill="url(#auroraMint)">
      <animateTransform attributeName="transform" type="translate" values="0 0;-120 -35;140 -55;0 0" keyTimes="0;0.38;0.7;1" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1" dur="34s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- drifting grid -->
  <g mask="url(#gridMask)" opacity="0.55">
    <rect x="-44" y="-44" width="1288" height="488" fill="url(#gridPattern)">
      <animateTransform attributeName="transform" type="translate" values="0 0;44 44" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- light sweep -->
  <g mask="url(#gridMask)" opacity="0.16">
    <rect x="-260" y="-220" width="240" height="840" fill="url(#sweep)" transform="skewX(-16)">
      <animateTransform attributeName="transform" type="translate" values="-420 0;1560 0" dur="11s" repeatCount="indefinite" additive="sum"/>
    </rect>
  </g>

  <!-- floating particles -->
  <g>
    <circle cx="92" cy="318" r="2.4" fill="#3ddc97"><animate attributeName="opacity" values="0;0.85;0" dur="9s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 0;-10 -55;0 0" dur="9s" repeatCount="indefinite"/></circle>
    <circle cx="168" cy="128" r="1.6" fill="#c792ea"><animate attributeName="opacity" values="0;0.7;0" dur="11s" begin="1.2s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 0;14 -46;0 0" dur="11s" begin="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="286" cy="352" r="2" fill="#5ba8ff"><animate attributeName="opacity" values="0;0.75;0" dur="8s" begin="2.4s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 0;-8 -60;0 0" dur="8s" begin="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="404" cy="72" r="1.8" fill="#3ddc97"><animate attributeName="opacity" values="0;0.8;0" dur="12s" begin="0.6s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 0;10 -40;0 0" dur="12s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="548" cy="300" r="2.2" fill="#c792ea"><animate attributeName="opacity" values="0;0.65;0" dur="10s" begin="3.1s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 0;-14 -52;0 0" dur="10s" begin="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="676" cy="150" r="1.5" fill="#5ba8ff"><animate attributeName="opacity" values="0;0.75;0" dur="9.5s" begin="1.8s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 0;8 -48;0 0" dur="9.5s" begin="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="782" cy="356" r="2.6" fill="#3ddc97"><animate attributeName="opacity" values="0;0.85;0" dur="8.5s" begin="0.3s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 0;-12 -58;0 0" dur="8.5s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle cx="896" cy="96" r="1.7" fill="#c792ea"><animate attributeName="opacity" values="0;0.7;0" dur="13s" begin="2.7s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 0;16 -38;0 0" dur="13s" begin="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="1004" cy="266" r="2.1" fill="#5ba8ff"><animate attributeName="opacity" values="0;0.7;0" dur="10.5s" begin="1.5s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 0;-9 -50;0 0" dur="10.5s" begin="1.5s" repeatCount="indefinite"/></circle>
    <circle cx="1108" cy="128" r="1.6" fill="#3ddc97"><animate attributeName="opacity" values="0;0.75;0" dur="9.2s" begin="3.6s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 0;11 -44;0 0" dur="9.2s" begin="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="1150" cy="340" r="2" fill="#c792ea"><animate attributeName="opacity" values="0;0.6;0" dur="11.5s" begin="0.9s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 0;-13 -42;0 0" dur="11.5s" begin="0.9s" repeatCount="indefinite"/></circle>
    <circle cx="60" cy="180" r="1.4" fill="#5ba8ff"><animate attributeName="opacity" values="0;0.6;0" dur="12.5s" begin="2s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 0;9 -36;0 0" dur="12.5s" begin="2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- horizon glow -->
  <ellipse cx="600" cy="402" rx="620" ry="70" fill="#3ddc97" fill-opacity="0.1" filter="url(#softBlur)">
    <animate attributeName="fill-opacity" values="0.07;0.14;0.07" dur="8s" repeatCount="indefinite"/>
  </ellipse>

  <!-- logo lockup (always painted; only the background animates) -->
  <g>
    <g transform="translate(220 80)">
      <g transform="scale(0.5)">
        <use href="#logoMark" filter="url(#logoGlow)" opacity="0.55"/>
        <use href="#logoMark"/>
      </g>
    </g>
  </g>

  <g>
    <text x="486" y="238" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="96" font-weight="800" letter-spacing="-2.5" fill="#3ddc97" opacity="0.22" filter="url(#textGlow)">Commit87</text>
    <text x="486" y="238" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="96" font-weight="800" letter-spacing="-2.5" fill="url(#wordmark)">Commit87</text>
    <text x="490" y="282" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="400" fill="#a3c4ba">Git, without the noise.</text>
  </g>

  <!-- depth -->
  <rect width="1200" height="400" fill="url(#vignette)"/>
  <rect x="0.5" y="0.5" width="1199" height="399" rx="14" fill="none" stroke="#3ddc97" stroke-opacity="0.16"/>
</svg>

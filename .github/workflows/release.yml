name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      draft:
        description: Publish as a draft release
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    name: Publish ${{ matrix.target }} (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux
            arch: x64
            runner: ubuntu-24.04
          - target: linux
            arch: arm64
            runner: ubuntu-24.04-arm
          - target: win
            arch: x64
            runner: windows-2022
          - target: win
            arch: arm64
            runner: windows-2022
          # macOS x64 is paused: GitHub-hosted Intel runners (macos-13) queue for a long
          # time. Restore the x64 entry once Intel capacity is available again.
          # - target: mac
          #   arch: x64
          #   runner: macos-13
          - target: mac
            arch: arm64
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Linux packaging tools
        if: matrix.target == 'linux'
        # deb/rpm/pacman go through electron-builder's bundled fpm, which needs
        # fakeroot and rpm on the host and bsdtar (libarchive-tools) for the
        # pacman .MTREE index.
        run: sudo apt-get update && sudo apt-get install -y fakeroot rpm libarchive-tools
      - run: node scripts/sync-version.mjs "${GITHUB_REF_NAME#v}"
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
      - run: npm test
      - run: npm run build
      - name: Build and publish
        run: npx electron-builder --config electron-builder.config.cjs --${{ matrix.target }} --${{ matrix.arch }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ matrix.target == 'mac' && secrets.MAC_CERT_P12 || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.target == 'mac' && secrets.MAC_CERT_PASSWORD || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK: ${{ matrix.target == 'win' && secrets.WIN_CERT_P12 || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ matrix.target == 'win' && secrets.WIN_CERT_PASSWORD || '' }}

  flatpak:
    name: Flatpak bundle
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y flatpak flatpak-builder
      - run: bash scripts/build-flatpak.sh
      - uses: actions/upload-artifact@v5
        with:
          name: flatpak
          path: dist/*.flatpak

  snap:
    name: Snap package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: sudo snap install snapcraft --classic
      - run: bash scripts/build-snap.sh
      - uses: actions/upload-artifact@v5
        with:
          name: snap
          path: '*.snap'
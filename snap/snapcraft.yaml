name: commit87
base: core24
version: '0.1.0'
summary: Focused desktop Git client
description: |
  Commit87 is a fast desktop Git client built on the system Git binary.
  It manages repositories, branches, worktrees, tags, releases and
  pipelines, and supports multiple Git identities for commits and pushes.

  * Commit graph with staging, commit, amend and sign-off
  * Branches, tags, stashes and worktrees
  * Pull requests, releases and CI pipelines for GitHub, GitLab,
    Bitbucket and Gitea
  * Per-repository identity and per-forge account mapping
  * Built-in git console that runs git directly (no shell)

grade: stable
confinement: strict
compression: lzo
icon: gui/commit87.png
license: MIT
website: https://commit87.fradinni.fr
source-code: https://github.com/fradinni/Commit87
issues: https://github.com/fradinni/Commit87/issues

platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]
  arm64:
    build-on: [arm64]
    build-for: [arm64]

apps:
  commit87:
    command: bin/command.sh
    desktop: share/applications/commit87.desktop
    extensions: [gnome]
    plugs:
      - home
      - removable-media
      - password-manager-service
      - ssh-keys
      - network
      - network-bind
      - unity7
      - gsettings
      - desktop
      - desktop-legacy
      - wayland
      - x11
      - browser-support
      - libsecret

parts:
  commit87:
    plugin: dump
    source: ../dist/linux-unpacked
    source-type: local
    stage-packages:
      - git
      - git-lfs
      - openssh-client
      - ca-certificates
      - libsecret-1-0
    organize:
      commit87: usr/lib/commit87/commit87
      resources: usr/lib/commit87/resources
      locales: usr/lib/commit87/locales
      chrome_100_percent.pak: usr/lib/commit87/chrome_100_percent.pak
      chrome_200_percent.pak: usr/lib/commit87/chrome_200_percent.pak
      icudtl.dat: usr/lib/commit87/icudtl.dat
      resources.pak: usr/lib/commit87/resources.pak
      snapshot_blob.bin: usr/lib/commit87/snapshot_blob.bin
      v8_context_snapshot.bin: usr/lib/commit87/v8_context_snapshot.bin
      libEGL.so: usr/lib/commit87/libEGL.so
      libGLESv2.so: usr/lib/commit87/libGLESv2.so
      libffmpeg.so: usr/lib/commit87/libffmpeg.so
      libvk_swiftshader.so: usr/lib/commit87/libvk_swiftshader.so
      libvulkan.so.1: usr/lib/commit87/libvulkan.so.1
      vk_swiftshader_icd.json: usr/lib/commit87/vk_swiftshader_icd.json
    prime:
      - usr/lib/commit87
      - usr/bin/git
      - usr/lib/git-core
      - usr/share/git-core
      - usr/bin/git-lfs
      - usr/bin/ssh
      - usr/share/applications
      - usr/share/icons
  launcher:
    plugin: dump
    source: local
    organize:
      command.sh: bin/command.sh
      commit87.desktop: share/applications/commit87.desktop